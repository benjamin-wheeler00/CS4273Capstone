# This is a standalone file for production
# Update the image names for the appropriate repository
services:
  frontend:
    image: ghcr.io/benjamin-wheeler00/cs4273capstone/frontend:main
    ports:
      - "3000:3000"
  backend:
    image: ghcr.io/benjamin-wheeler00/cs4273capstone/backend:main
    gpus: all
    ports:
      - "5001:5001"
    environment:
      OLLAMA_HOST: http://ollama:11434
  ollama:
    image: ghcr.io/benjamin-wheeler00/cs4273capstone/ollama:main
    gpus: all
